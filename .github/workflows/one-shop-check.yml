name: ONE SHOT production check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Syntax · loader
        run: node --check app.js
      - name: Syntax · core
        run: node --check app-core-v5.6.3.js
      - name: Syntax · runtime bridge
        run: node --check one-shop-runtime-bridge-v605.js
      - name: Syntax · media safety
        run: node --check one-shop-media-safety-v601.js
      - name: Syntax · local media vault
        run: node --check one-shop-local-media-v602.js
      - name: Syntax · photo recovery
        run: node --check one-shop-photo-recovery-v600.js
      - name: Syntax · broken image repair
        run: node --check one-shop-broken-image-repair-v604.js
      - name: Syntax · auto photo rescue
        run: node --check one-shop-auto-photo-rescue-v603.js
      - name: Syntax · report coordinates
        run: node --check one-shop-report-coordinates-v606.js
      - name: Syntax · service worker
        run: node --check service-worker.js
      - name: Syntax · Android packager
        run: node --check APK/scripts/prepare-webdir.js

      - name: Prepare Android webDir
        run: npm run web:prepare

      - name: Photo persistence and recovery guard
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const path=require('path');
          const must=[
            'app.js',
            'app-core-v5.6.3.js',
            'one-shop-runtime-bridge-v605.js',
            'one-shop-media-safety-v601.js',
            'one-shop-local-media-v602.js',
            'one-shop-photo-recovery-v600.js',
            'one-shop-broken-image-repair-v604.js',
            'one-shop-auto-photo-rescue-v603.js',
            'one-shop-report-coordinates-v606.js',
            'service-worker.js',
            'version.json'
          ];
          for(const f of must){
            const p=path.join('www',f);
            if(!fs.existsSync(p)) throw new Error('APK incompleto: falta '+p);
          }
          for(const f of must){
            if(f!=='version.json'){
              const root=fs.readFileSync(f,'utf8');
              const packaged=fs.readFileSync(path.join('www',f),'utf8');
              if(root!==packaged) throw new Error('www/'+f+' quedó desfasado respecto al runtime principal');
            }
          }
          const loader=fs.readFileSync('www/app.js','utf8');
          for(const f of ['one-shop-runtime-bridge-v605.js','one-shop-media-safety-v601.js','one-shop-local-media-v602.js','one-shop-photo-recovery-v600.js','one-shop-broken-image-repair-v604.js','one-shop-auto-photo-rescue-v603.js','one-shop-report-coordinates-v606.js']){
            if(!loader.includes(f)) throw new Error('app.js no carga '+f);
          }
          const sw=fs.readFileSync('www/service-worker.js','utf8');
          for(const f of ['one-shop-runtime-bridge-v605.js','one-shop-media-safety-v601.js','one-shop-local-media-v602.js','one-shop-photo-recovery-v600.js','one-shop-broken-image-repair-v604.js','one-shop-report-coordinates-v606.js']){
            if(!sw.includes(f)) throw new Error('Service Worker no cachea '+f);
          }
          const bridge=fs.readFileSync('www/one-shop-runtime-bridge-v605.js','utf8');
          const vault=fs.readFileSync('www/one-shop-local-media-v602.js','utf8');
          const safety=fs.readFileSync('www/one-shop-media-safety-v601.js','utf8');
          const recovery=fs.readFileSync('www/one-shop-photo-recovery-v600.js','utf8');
          const repair=fs.readFileSync('www/one-shop-broken-image-repair-v604.js','utf8');
          const auto=fs.readFileSync('www/one-shop-auto-photo-rescue-v603.js','utf8');
          const coords=fs.readFileSync('www/one-shop-report-coordinates-v606.js','utf8');
          for(const binding of ['window.State=State','window.Store=Store','window.Camera=Camera','window.Gallery=Gallery']){
            if(!bridge.includes(binding)) throw new Error('Bridge incompleto: falta '+binding);
          }
          if(!vault.includes("navigator.storage?.persist?.()")) throw new Error('Falta solicitud de almacenamiento persistente');
          if(!vault.includes("oneshotMediaVault_v1")) throw new Error('Falta baúl local independiente');
          if(!safety.includes('protectRecord')) throw new Error('Falta blindaje contra sobrescritura lite');
          if(!recovery.includes('recoverAll')) throw new Error('Falta recuperación integral de fotos');
          if(!repair.includes('recoverOne')) throw new Error('Falta recuperación al romperse una imagen de tarjeta');
          if(!repair.includes('reportImage4x3')) throw new Error('La galería no contempla copias alternativas de foto');
          if(!auto.includes('recoverOne')) throw new Error('Falta rescate automático de evidencias existentes');
          if(!coords.includes("n.toFixed(digits)")) throw new Error('Coordenadas no conservan el signo decimal');
          if(coords.includes('Math.abs(n).toFixed')) throw new Error('No se debe eliminar el signo de latitud/longitud');
          if(!coords.includes("n<0?'S':'N'")||!coords.includes("n<0?'W':'E'")) throw new Error('Falta hemisferio N/S/E/W');
          if(!coords.includes("Object.defineProperty(window,'ONE_FIELD_REPORT_STANDARD'")) throw new Error('Falta hook al reporte estándar cargado en diferido');
          if(!coords.includes('api.patch=patched')) throw new Error('Falta reaplicar coordenadas después de patch() del reporte');
          console.log('ONE SHOT: persistencia, rescate y coordenadas firmadas con hook runtime incluidas en APK.');
          NODE

      - name: Existing field/report rules
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const tools=fs.readFileSync('one-shop-field-tools-v571.js','utf8');
          const report=fs.readFileSync('one-field-report-standard.js','utf8');
          if(!tools.includes('oneshotPropagandaSegmentsV1')) throw new Error('Falta almacenamiento independiente de tramos');
          if(!tools.includes('persistSegments()')) throw new Error('Falta verificación de persistencia de tramos');
          if(!tools.includes("type==='PANEL'")) throw new Error('Empresa no está condicionada a PANEL');
          if(!report.includes("if(type!=='PANEL')return''")) throw new Error('Excel no limita proveedor a PANEL');
          for(const field of ["header:'REGIÓN'","header:'PROVINCIA'","header:'DISTRITO'","header:'DIRECCIÓN CAPTURA'"]){
            if(!report.includes(field)) throw new Error('Falta campo territorial '+field);
          }
          console.log('Reglas de campo/reporte conservadas.');
          NODE
