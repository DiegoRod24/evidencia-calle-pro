name: ONE SHOP production check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check one-shop-stable-runtime.js
          node --check one-shop-field-tools-v571.js
          node --check one-field-report-standard.js
          node --check service-worker.js
      - name: Version and report rules
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const v=JSON.parse(fs.readFileSync('version.json','utf8'));
          const sw=fs.readFileSync('service-worker.js','utf8');
          const tools=fs.readFileSync('one-shop-field-tools-v571.js','utf8');
          const report=fs.readFileSync('one-field-report-standard.js','utf8');
          if(v.build!=='one-shop-v5.9.9-tramos-durables-01') throw new Error('version.json build inesperada: '+v.build);
          if(!sw.includes('oneshop-v5.9.9-tramos-durables-01')) throw new Error('Service Worker no apunta a 5.9.9');
          if(!tools.includes("one-shop-v5.9.9-tramos-durables-01")) throw new Error('Field tools no apunta a 5.9.9');
          if(!tools.includes("oneshotPropagandaSegmentsV1")) throw new Error('Falta almacenamiento independiente de tramos');
          if(!tools.includes("persistSegments()")) throw new Error('Falta verificación de persistencia de tramos');
          if(!tools.includes("type==='PANEL'")) throw new Error('Empresa no está condicionada a PANEL');
          if(!report.includes("if(type!=='PANEL')return''")) throw new Error('Excel no limita proveedor a PANEL');
          for(const field of ["header:'REGIÓN'","header:'PROVINCIA'","header:'DISTRITO'","header:'DIRECCIÓN CAPTURA'"]) if(!report.includes(field)) throw new Error('Falta campo territorial '+field);
          if(!report.includes('one-field-report-standard-v8')) throw new Error('Reporte estándar no está en v8');
          console.log('ONE SHOP 5.9.9 consistente · tramos durables · reporte territorial municipal · fotos 4:3 fijas');
          NODE
