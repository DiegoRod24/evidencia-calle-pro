name: ONE SHOP production check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: JavaScript syntax
        run: |
          node --check app.js
          node --check one-shop-stable-runtime.js
          node --check one-shop-field-tools-v571.js
          node --check one-field-report-standard.js
          node --check service-worker.js
      - name: Version consistency
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const v=JSON.parse(fs.readFileSync('version.json','utf8'));
          const sw=fs.readFileSync('service-worker.js','utf8');
          const rt=fs.readFileSync('one-shop-stable-runtime.js','utf8');
          if(v.build!=='one-shop-v5.7.1-field-essential-01') throw new Error('version.json build inesperada: '+v.build);
          if(!sw.includes('oneshop-v5.7.1-field-essential-01')) throw new Error('Service Worker no apunta a 5.7.1');
          if(!rt.includes("one-shop-v5.7.1-field-essential-01")) throw new Error('Runtime no apunta a 5.7.1');
          console.log('ONE SHOP 5.7.1 consistente');
          NODE
